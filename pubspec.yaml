name: flutter_movie_recommendation
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.3+4

environment:
  sdk: '>=3.5.0 <4.0.0' # SDK Terbaru untuk library modern

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  http: ^1.2.2
  dio: ^5.7.0
  connectivity_plus: ^7.0.0 # Latest

  # State Management
  provider: ^6.1.2
  flutter_riverpod: ^2.6.1 # Stick to 2.x for now as 3.x implies huge migration, but this is the latest stable widely used.
                           # If you really want 3.x (beta/new), change to ^3.0.0, but it WILL break your StateNotifiers.
                           # Terminal said 3.2.0 available? That might be pure 'riverpod', flutter_riverpod usually follows.
                           # I'll keep 2.6.1 to be safe with your existing code structure.

  # Image & UI
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  google_fonts: ^6.2.1

  # Local Storage & DB
  shared_preferences: ^2.5.3
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0

  # Utilities
  intl: ^0.19.0
  flutter_dotenv: ^5.2.1
  image_picker: ^1.1.2
  crypto: ^3.0.6
  
  # Dependency Injection
  get_it: ^8.0.3 # Latest Stable. 9.x might be prerelease.

  # Firebase (Latest)
  firebase_core: ^3.10.0
  firebase_auth: ^5.4.0
  firebase_database: ^11.3.0
  
  # Routing
  go_router: ^14.8.0 # Latest stable v14. v15+ is available but let's be safe.

  # Architecture
  dartz: ^0.10.1
  equatable: ^2.0.8
  json_serializable: ^6.11.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  
flutter:
  uses-material-design: true
  assets:
    - .env
